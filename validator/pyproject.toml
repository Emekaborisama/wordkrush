[project]
name = "moreless-validator"
version = "0.1.0"
description = "Offline LLM adjudication service for WordKrush comparison content. Pipeline-time only; never called by the game at runtime."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
