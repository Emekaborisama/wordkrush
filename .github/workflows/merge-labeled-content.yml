name: Merge labeled content PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Ready or merge eligible content PR
        uses: actions/github-script@v9
        env:
          CONTENT_AUTOMERGE_TOKEN: ${{ secrets.CONTENT_AUTOMERGE_TOKEN }}
        with:
          github-token: ${{ secrets.CONTENT_AUTOMERGE_TOKEN || github.token }}
          script: |
            const autoMergeLabel = 'automation:auto-merge';
            const eligibleHeadBranches = new Set([
              'content/clueless-daily',
              'content/wordfall-weekly',
            ]);
            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            let pullNumber;
            let successfulCiForHead = false;
            let workflowRun;

            if (eventName === 'workflow_run') {
              workflowRun = context.payload.workflow_run;
              if (
                workflowRun.conclusion !== 'success' ||
                workflowRun.event !== 'pull_request'
              ) {
                core.info('Ignoring a CI run that did not succeed for a pull request.');
                return;
              }

              const [pullRequest] = workflowRun.pull_requests ?? [];
              if (!pullRequest) {
                core.info('The successful CI run is not associated with a pull request.');
                return;
              }

              pullNumber = pullRequest.number;
              successfulCiForHead = true;
            } else if (eventName === 'pull_request_target') {
              pullNumber = context.payload.pull_request.number;
            } else {
              core.info(`Ignoring unsupported event: ${eventName}.`);
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            const labels = new Set(pull.labels.map(({ name }) => name));
            const isEligibleContentPull =
              pull.state === 'open' &&
              pull.base.ref === 'master' &&
              pull.head.repo?.full_name === `${owner}/${repo}` &&
              eligibleHeadBranches.has(pull.head.ref) &&
              labels.has(autoMergeLabel);

            if (!isEligibleContentPull) {
              core.info(`PR #${pull.number} is not an eligible labeled content PR.`);
              return;
            }

            if (!process.env.CONTENT_AUTOMERGE_TOKEN) {
              core.setFailed('Set CONTENT_AUTOMERGE_TOKEN before enabling content auto-merge.');
              return;
            }

            if (pull.draft) {
              if (
                eventName !== 'pull_request_target' ||
                context.payload.action !== 'labeled'
              ) {
                core.info(`PR #${pull.number} is still a draft.`);
                return;
              }

              const result = await github.graphql(
                `mutation MarkPullRequestReadyForReview($pullRequestId: ID!) {
                  markPullRequestReadyForReview(
                    input: { pullRequestId: $pullRequestId }
                  ) {
                    pullRequest {
                      isDraft
                    }
                  }
                }`,
                { pullRequestId: pull.node_id },
              );

              if (result.markPullRequestReadyForReview.pullRequest.isDraft) {
                core.setFailed(`PR #${pull.number} remained a draft.`);
                return;
              }

              core.notice(`Marked eligible content PR #${pull.number} ready for review.`);
              return;
            }

            if (
              workflowRun &&
              workflowRun.head_sha !== pull.head.sha
            ) {
              core.info(`PR #${pull.number} has newer untested changes.`);
              return;
            }

            if (!successfulCiForHead) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                event: 'pull_request',
                head_sha: pull.head.sha,
                per_page: 100,
              });

              successfulCiForHead = runs.workflow_runs.some(
                (run) =>
                  run.conclusion === 'success' &&
                  run.head_branch === pull.head.ref &&
                  run.head_sha === pull.head.sha,
              );
            }

            if (!successfulCiForHead) {
              core.info(`PR #${pull.number} does not have a successful CI run for its current head.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const latestReviewByAuthor = new Map();

            for (const review of reviews) {
              if (review.user?.login) {
                latestReviewByAuthor.set(review.user.login, review.state);
              }
            }

            if (
              [...latestReviewByAuthor.values()].includes('CHANGES_REQUESTED')
            ) {
              core.info(`PR #${pull.number} has requested changes.`);
              return;
            }

            const { data: merge } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              sha: pull.head.sha,
              merge_method: 'merge',
            });

            if (merge.merged) {
              core.notice(`Merged eligible content PR #${pull.number}.`);
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${pull.head.ref}`,
                });
              } catch (error) {
                core.warning(`Merged PR #${pull.number}, but could not delete ${pull.head.ref}: ${error.message}`);
              }
            } else {
              core.warning(`PR #${pull.number} was not merged: ${merge.message}`);
            }
