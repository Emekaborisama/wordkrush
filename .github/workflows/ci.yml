name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # Proves the Expo web export on every PR and master push. Railway also runs
  # `npm run build:web` at deploy time; catching a broken export here means a
  # bad bundle cannot merge. Local `npm run check` stays fast and does not
  # include this step.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web

  # Deploys the web build to Railway (docs/STACK.md D-020, D-029).
  #
  # Gated on `check` and `web` rather than running beside them: the repo's
  # definition of done is a green check plus a successful Expo web export, and
  # a host that deploys a red build turns that from a rule into a suggestion.
  # Pull requests never reach this job, so a fork cannot deploy.
  deploy:
    needs: [check, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Railway builds the bundle itself (railway.json -> npm run build:web), so
    # this job only uploads the source and streams the result.
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Railway
        env:
          # Project token, scoped to one project + environment.
          # Railway dashboard -> best-games -> Settings -> Tokens.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::warning::RAILWAY_TOKEN is not set — skipping deploy."
            echo "Add it under Settings → Secrets and variables → Actions to enable auto-deploy."
            exit 0
          fi
          npm install -g @railway/cli@4
          # --ci streams build logs and exits non-zero if the build or the
          # health check fails, so a broken deploy fails the workflow instead of
          # going green while the site is down.
          railway up --service wordcrush --ci --message "${GITHUB_SHA::7} — ${GITHUB_REF_NAME}"
