name: GitHub Release

# Every PR is a version. Merge to master publishes the GitHub Release for
# package.json's x.y.z from that CHANGELOG section. Pushing tag vX.Y.Z does
# the same. This does not run EAS or App Store submit (owner accounts; see
# WORKFLOW.md).
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        id: notes
        env:
          REQUIRE_NOTES: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: |
          set +e
          node scripts/changelog-notes.mjs "${{ steps.ver.outputs.version }}" > release-notes.md
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${REQUIRE_NOTES}" = "true" ]; then
            echo "Changelog has no [${{ steps.ver.outputs.version }}] section."
            exit 1
          fi
          echo "Changelog has no [${{ steps.ver.outputs.version }}] section — not a release commit."
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.notes.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — leaving it."
            exit 0
          fi
          gh release create "$TAG" \
            --title "WordKrush ${{ steps.ver.outputs.version }}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            --latest
