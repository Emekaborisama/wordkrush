<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to WordKrush</title>
  </head>
  <body style="margin:0;padding:0;background-color:#0A0817;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0A0817;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td style="padding:0 8px 28px 8px;font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-0.02em;">
                <span style="color:#FFF9F6;">Word</span><span style="color:#FFB020;">Krush</span>
              </td>
            </tr>
            <tr>
              <td style="background-color:#1A1732;border:1px solid #332D55;border-radius:18px;padding:32px 28px;">
                <p style="margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#FFB020;">
                  Sign in
                </p>
                <h1 style="margin:0 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:24px;line-height:1.25;color:#FFF9F6;">
                  Keep your scores with you
                </h1>
                <p style="margin:0 0 24px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#C5BED8;">
                  Open this link on this device. It expires shortly and works once. No password.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:14px;background-color:#FFB020;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;color:#0A0817;text-decoration:none;">
                        Sign in to WordKrush
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;color:#87809E;">
                  Or type this code in the app
                </p>
                <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:1.2;letter-spacing:0.18em;font-weight:700;color:#FFF9F6;">
                  {{ .Token }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 8px 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#87809E;">
                If you didn’t ask to sign in, ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
